name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose server state
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Report layout
        run: |
          ssh -o BatchMode=yes root@45.32.102.242 bash -s <<'ENDSSH'
          set -u
          echo "=== ~/deployment ==="
          ls -la ~/deployment 2>&1 | head -20 || echo "(missing)"
          echo ""
          echo "=== ~/deployment git state ==="
          if [ -d ~/deployment/.git ]; then
            cd ~/deployment
            git remote -v
            git rev-parse HEAD 2>&1 || true
            git status --short | head -10
          else
            echo "(not a git repo)"
          fi
          echo ""
          echo "=== /var/www ==="
          ls -la /var/www/ 2>&1 | head -20
          echo ""
          echo "=== api.exquillermember.com contents ==="
          ls -la /var/www/api.exquillermember.com/ 2>&1 | head -20
          echo ""
          echo "=== /var/www/api is it a symlink? ==="
          readlink -f /var/www/api.exquillermember.com 2>&1 || true
          echo ""
          echo "=== nginx config that serves api.exquillermember.com ==="
          grep -rl "api.exquillermember.com" /etc/nginx/ 2>&1 | head -5
          grep -A5 "root " /etc/nginx/sites-enabled/*api* 2>&1 | head -10 || true
          echo ""
          echo "=== php version ==="
          php --version | head -1
          echo ""
          echo "=== .env on api dir present? (not contents) ==="
          ls -la /var/www/api.exquillermember.com/.env 2>&1 || echo "(no .env)"
          ENDSSH
