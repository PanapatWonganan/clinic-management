name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy backend (pull + composer + migrate)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Snapshot DB before migrate
        run: |
          ssh -o BatchMode=yes root@45.32.102.242 bash -s <<'ENDSSH'
          set -e
          mkdir -p /root/db-backups
          TS=$(date +%Y%m%d-%H%M%S)
          BACKUP_FILE="/root/db-backups/clinic_db_${TS}.sql.gz"
          mysqldump --single-transaction --quick --no-tablespaces clinic_db | gzip > "$BACKUP_FILE"
          if [ ! -s "$BACKUP_FILE" ]; then
            echo "Backup file is empty — aborting deploy"
            exit 1
          fi
          ls -lh "$BACKUP_FILE"
          # Prune backups older than 14 days
          find /root/db-backups -name "clinic_db_*.sql.gz" -mtime +14 -delete 2>/dev/null || true
          ENDSSH

      - name: Pull, install, migrate, clear cache
        run: |
          ssh -o BatchMode=yes root@45.32.102.242 bash -s <<'ENDSSH'
          set -e
          cd ~/deployment
          echo "=== Before pull ==="
          git rev-parse HEAD
          git fetch origin main
          echo "=== Target ==="
          git rev-parse origin/main
          # History was rewritten in April 2026 to purge committed secrets
          # (see CLAUDE.md); reset --hard is intentional, git pull would diverge.
          git reset --hard origin/main
          cd clinic-backend
          echo "=== Composer install ==="
          composer install --no-dev --optimize-autoloader --no-interaction 2>&1 | tail -10
          echo "=== Migrate ==="
          php artisan migrate --force 2>&1 | tail -20
          echo "=== Cache clear ==="
          php artisan config:clear
          php artisan cache:clear
          php artisan view:clear
          php artisan route:clear
          echo "=== Cache rebuild (production) ==="
          php artisan config:cache
          php artisan route:cache
          echo "=== Restart queue workers (graceful) ==="
          php artisan queue:restart
          echo "=== Done ==="
          git rev-parse HEAD
          ENDSSH

      - name: Smoke test API
        run: |
          set -e
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://api.exquillermember.com/api/products)
          if [ "$HTTP" != "200" ]; then
            echo "Smoke test failed: /api/products returned $HTTP"
            exit 1
          fi
          echo "OK: /api/products → $HTTP"

  diagnose:
    name: Post-deploy diagnose
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: always()
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Report layout
        run: |
          ssh -o BatchMode=yes root@45.32.102.242 bash -s <<'ENDSSH'
          set -u
          echo "=== ~/deployment git state ==="
          if [ -d ~/deployment/.git ]; then
            cd ~/deployment
            git rev-parse HEAD
            git log -1 --oneline
            git status --short | head -10
          else
            echo "(not a git repo)"
          fi
          echo ""
          echo "=== migrate:status (last 10) ==="
          cd ~/deployment/clinic-backend
          php artisan migrate:status 2>&1 | tail -10
          echo ""
          echo "=== orders.payment_method enum ==="
          php artisan tinker --execute="echo \DB::selectOne(\"SHOW COLUMNS FROM orders LIKE 'payment_method'\")->Type . PHP_EOL;" 2>&1 | tail -3
          echo ""
          echo "=== php version ==="
          php --version | head -1
          ENDSSH
